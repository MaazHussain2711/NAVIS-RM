<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Face Detection</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 20px;
            font-size: 2rem;
            color: #00ffe7;
        }

        img {
            margin-top: 20px;
            border: 5px solid #00ffe7;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 231, 0.3);
            max-width: 90%;
        }

        button {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff004f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #ff3366;
            transform: scale(1.05);
        }

        form {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Live Stream (Recognizing Uploaded Face)</h1>
    <img src="{{ url_for('video_feed') }}" alt="Live Feed">
    <form action="/stop" method="get">
        <button type="submit">Stop Detection</button>
    </form>
</body>
</html>
